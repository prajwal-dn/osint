<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSINT Investigation Tool — Simulation Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

<style>
:root {
  --bg:      #07111a;
  --s1:      #0b1825;
  --s2:      #0f2030;
  --s3:      #132438;
  --border:  #1a2d3e;
  --border2: #203546;
  --text:    #d8e8f4;
  --sub:     #5c7b94;
  --sub2:    #8aaabf;
  --blue:    #3ab4f2;
  --blue2:   #0d96dd;
  --teal:    #2dd4bf;
  --violet:  #a78bfa;
  --green:   #34d399;
  --yellow:  #fbbf24;
  --red:     #f87171;
  --r:       10px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  font-size: 13.5px;
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ─── HEADER ─────────────────────────── */
header {
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  background: var(--s1);
  position: relative;
  z-index: 20;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--blue), var(--violet));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
}

.brand-name {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.2px;
}

.brand-name em {
  color: var(--blue);
  font-style: normal;
}

.header-center {
  display: flex;
  align-items: center;
  gap: 2px;
}

.nav-btn {
  padding: 5px 14px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--sub);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .4px;
  cursor: pointer;
  transition: all .15s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.nav-btn:hover { color: var(--text); background: rgba(255,255,255,.04); }

.nav-btn.on {
  color: var(--blue);
  background: rgba(58,180,242,.1);
}

.nav-provenance.on {
  color: var(--yellow);
  background: rgba(251,191,36,.08);
  border: 1px solid rgba(251,191,36,.2);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

.sim-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  color: var(--yellow);
  background: rgba(251,191,36,.09);
  border: 1px solid rgba(251,191,36,.25);
  padding: 3px 9px;
  border-radius: 20px;
}

.online-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 7px var(--green);
  animation: blink 2.2s ease-in-out infinite;
}

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

/* ─── LAYOUT ─────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 330px 1fr;
  height: calc(100vh - 52px);
}

/* ─── SIDEBAR ────────────────────────── */
.sidebar {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--s1);
  overflow: hidden;
}

.sidebar-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

/* ─── QUERY TYPE SWITCHER ────────────── */
.qtype-row {
  display: flex;
  gap: 5px;
  margin-bottom: 14px;
}

.qt-btn {
  flex: 1;
  padding: 8px 0;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--s2);
  color: var(--sub2);
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: all .18s;
}

.qt-btn .icon { font-size: 15px; }
.qt-btn:hover { border-color: var(--blue); color: var(--blue); }
.qt-btn.on {
  background: rgba(58,180,242,.1);
  border-color: var(--blue);
  color: var(--blue);
}

/* ─── FORM ───────────────────────────── */
.field { margin-bottom: 11px; }

.field label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--sub2);
  margin-bottom: 5px;
  letter-spacing: .2px;
}

.req { color: var(--blue); }

.field input,
.field textarea {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--border2);
  color: var(--text);
  padding: 9px 11px;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}

.field input:focus,
.field textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(58,180,242,.1);
}

.field input::placeholder,
.field textarea::placeholder { color: var(--sub); font-size: 12.5px; }
.field textarea { resize: none; height: 68px; }

/* ─── HINT TEXT ──────────────────────── */
.hint {
  font-size: 11px;
  color: var(--sub);
  margin-top: 4px;
  line-height: 1.5;
}

/* ─── RUN BUTTON ─────────────────────── */
.btn-run {
  width: 100%;
  background: linear-gradient(135deg, var(--blue), var(--blue2));
  color: #03121e;
  border: none;
  padding: 10px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  margin-top: 4px;
  transition: all .18s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  box-shadow: 0 3px 14px rgba(58,180,242,.22);
}

.btn-run:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 22px rgba(58,180,242,.33);
}

.btn-run:disabled { opacity: .4; cursor: not-allowed; transform: none; }

.btn-ghost {
  width: 100%;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--sub2);
  padding: 8px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  margin-top: 6px;
  transition: all .18s;
}

.btn-ghost:hover {
  border-color: var(--blue);
  color: var(--blue);
  background: rgba(58,180,242,.04);
}

/* ─── DIVIDER ────────────────────────── */
.divider {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: var(--sub);
}

.divider::before,
.divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ─── PERSONA FILTER TABS ────────────── */
.filter-row {
  display: flex;
  gap: 4px;
  margin-bottom: 10px;
}

.filter-tab {
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--sub2);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}

.filter-tab:hover { border-color: var(--blue); color: var(--blue); }
.filter-tab.on {
  background: rgba(58,180,242,.1);
  border-color: rgba(58,180,242,.4);
  color: var(--blue);
}

/* ─── PERSONA LIST ───────────────────── */
.persona-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  max-height: 270px;
  overflow-y: auto;
}

.persona-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--s2);
  cursor: pointer;
  transition: all .16s;
  position: relative;
}

.persona-card:hover {
  border-color: var(--blue);
  background: rgba(58,180,242,.05);
  transform: translateX(2px);
}

.persona-card:hover .card-arrow { opacity: 1; }

.card-arrow {
  position: absolute;
  right: 10px;
  color: var(--blue);
  font-size: 12px;
  opacity: 0;
  transition: opacity .15s;
}

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
  font-family: 'Inter', sans-serif;
}

.av-blue   { background: linear-gradient(135deg, #3ab4f2, #0d96dd); }
.av-violet { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
.av-teal   { background: linear-gradient(135deg, #2dd4bf, #0d9488); }
.av-green  { background: linear-gradient(135deg, #34d399, #059669); }

.card-info { flex: 1; min-width: 0; }

.card-name {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-sub {
  font-size: 11px;
  color: var(--sub);
  font-family: 'JetBrains Mono', monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}

.card-type-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ─── LEGAL NOTE ─────────────────────── */
.legal {
  margin-top: 14px;
  font-size: 11px;
  line-height: 1.55;
  color: var(--sub);
  background: rgba(251,191,36,.05);
  border: 1px solid rgba(251,191,36,.18);
  border-radius: 8px;
  padding: 9px 11px;
}

.legal strong { color: var(--yellow); font-weight: 600; }

/* ─── MAIN AREA ──────────────────────── */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* ─── GRAPH ──────────────────────────── */
.graph-wrap {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#graph { width: 100%; height: 100%; }

.graph-idle {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  pointer-events: none;
}

.graph-idle-ring {
  width: 72px; height: 72px;
  border-radius: 50%;
  border: 1.5px dashed var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
  opacity: .4;
}

.graph-idle p {
  font-size: 12.5px;
  color: var(--sub);
  text-align: center;
  max-width: 220px;
  line-height: 1.65;
  opacity: .7;
}

.graph-tag {
  position: absolute;
  top: 12px; left: 14px;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--sub);
  letter-spacing: .5px;
  text-transform: uppercase;
  background: rgba(7,17,26,.85);
  padding: 3px 9px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

/* ─── LOADING OVERLAY ────────────────── */
.overlay {
  position: absolute;
  inset: 0; z-index: 10;
  background: rgba(7,17,26,.72);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  backdrop-filter: blur(3px);
}

.spin-ring {
  width: 40px; height: 40px;
  border: 2.5px solid var(--border2);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.overlay-text {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--sub2);
  animation: blink 1.4s ease-in-out infinite;
}

/* Mini spinner for button */
.btn-spin {
  width: 13px; height: 13px;
  border: 2px solid rgba(3,18,30,.3);
  border-top-color: #03121e;
  border-radius: 50%;
  animation: spin .65s linear infinite;
}

/* ─── RESULTS PANEL ──────────────────── */
.results {
  border-top: 1px solid var(--border);
  height: 43%;
  display: flex;
  flex-direction: column;
  background: var(--s1);
}

/* ─── TABS ───────────────────────────── */
.tab-bar {
  display: flex;
  padding: 8px 16px 0;
  gap: 2px;
  border-bottom: 1px solid var(--border);
  background: var(--s1);
  flex-shrink: 0;
}

.tab {
  padding: 6px 14px;
  border-radius: 7px 7px 0 0;
  border: 1px solid transparent;
  border-bottom: none;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  color: var(--sub);
  background: transparent;
  transition: all .16s;
  position: relative;
  bottom: -1px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.tab:hover { color: var(--text); }

.tab.on {
  background: var(--s2);
  border-color: var(--border);
  color: var(--blue);
}

.tab-badge {
  background: var(--border2);
  color: var(--sub);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 8px;
}

.tab.on .tab-badge {
  background: rgba(58,180,242,.15);
  color: var(--blue);
}

/* ─── TAB CONTENT ────────────────────── */
.tab-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
}

/* ─── EMPTY ──────────────────────────── */
.mt-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--sub);
  gap: 6px;
}

.mt-empty .e-icon { font-size: 26px; opacity: .35; }
.mt-empty p { font-size: 12.5px; opacity: .5; text-align: center; }

/* ─── RESULT GRID ────────────────────── */
.result-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 10px;
}

/* ─── CARD ───────────────────────────── */
.rcard {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  animation: slideUp .25s ease both;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(5px); }
  to   { opacity: 1; transform: translateY(0); }
}

.rcard-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.rcard-ico {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}

.ico-blue   { background: rgba(58,180,242,.1); }
.ico-green  { background: rgba(52,211,153,.1); }
.ico-violet { background: rgba(167,139,250,.1); }

.rcard-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text);
}

.rcard-sub {
  font-size: 10.5px;
  color: var(--sub);
  margin-top: 1px;
}

/* ─── PLATFORM ROW ───────────────────── */
.plat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.plat-row:last-child { border-bottom: none; }

.plat-name {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}

.plat-alive {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 5px var(--green);
}

.plat-url {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--sub);
}

/* ─── MATCH ROW ──────────────────────── */
.match-row {
  display: flex;
  align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}

.match-row:last-child { border-bottom: none; }

.match-info { flex: 1; overflow: hidden; }
.match-name { font-size: 12.5px; font-weight: 600; }
.match-id   { font-size: 10px; color: var(--sub); font-family: 'JetBrains Mono', monospace; margin-top: 1px; }

.match-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.conf {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 9px;
}

.c-hi  { background: rgba(52,211,153,.12); color: var(--green); }
.c-mid { background: rgba(251,191,36,.12);  color: var(--yellow); }
.c-lo  { background: rgba(248,113,113,.12); color: var(--red); }

.conf-track {
  width: 72px; height: 3px;
  background: var(--border2);
  border-radius: 2px;
  overflow: hidden;
}

.conf-fill {
  height: 100%;
  border-radius: 2px;
  transition: width .45s ease;
}

/* ─── COURT PILLS ────────────────────── */
.court-row {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.court-row:last-child { border-bottom: none; }

.cnr {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--blue);
  font-weight: 600;
}

.pill-wrap { display: flex; gap: 5px; margin-top: 3px; }

.pill {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 8px;
}

.p-civil    { background: rgba(58,180,242,.1); color: var(--blue); }
.p-criminal { background: rgba(248,113,113,.1); color: var(--red); }
.p-pending  { background: rgba(251,191,36,.1);  color: var(--yellow); }
.p-disposed { background: rgba(52,211,153,.1);  color: var(--green); }
.p-trial    { background: rgba(167,139,250,.1); color: var(--violet); }
.p-acquit   { background: rgba(52,211,153,.08); color: #6ee7b7; }

/* ─── RECOMMENDED ACTIONS ──────────────── */
.actions-block {
  background: rgba(251,191,36,.04);
  border: 1px solid rgba(251,191,36,.18);
  border-radius: 9px;
  padding: 10px 14px;
  margin-bottom: 12px;
  animation: slideUp .2s ease both;
}

.actions-head {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--yellow);
  margin-bottom: 7px;
}

.action-item {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  font-size: 11.5px;
  color: var(--sub2);
  line-height: 1.6;
  padding: 2px 0;
}

.action-item::before {
  content: '—';
  color: var(--yellow);
  flex-shrink: 0;
  margin-top: 1px;
}

.action-item b { color: var(--text); }

/* ─── INTEL PANELS ───────────────────── */
.intel-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.intel-panel {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 9px;
  overflow: hidden;
  animation: slideUp .22s ease both;
}

.intel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--s3);
}

.intel-title {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--sub);
}

.intel-badge {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--blue);
  letter-spacing: .3px;
}

.intel-badge.green { color: var(--green); }
.intel-badge.yellow { color: var(--yellow); }
.intel-badge.red { color: var(--red); }

.intel-body { padding: 8px 12px; }

/* Sherlock rows */
.sh-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11.5px;
}

.sh-row:last-child { border-bottom: none; }

.sh-plat {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--sub2);
  font-weight: 500;
}

.sh-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
}

.sh-dot.claimed   { background: var(--green); box-shadow: 0 0 4px var(--green); }
.sh-dot.available { background: var(--border2); }

.sh-uname { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--sub); }

.sh-status {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
}

.sh-status.claimed   { color: var(--yellow); }
.sh-status.available { color: var(--sub); }

/* Shodan rows */
.sd-host {
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
}

.sd-host:last-child { border-bottom: none; }

.sd-ip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--blue);
  margin-bottom: 2px;
}
